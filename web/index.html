<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="GitTok — 用中文刷 GitHub 好项目 · AI 推荐 · 大牛动态 · 搜索" />
    <!-- SEO / 分享卡片（2026-09-22）：og:image 与 canonical 必须是绝对地址，
         且指向站点域名（GitHub Pages 子路径 /gittok/）；og-image.png 随 vite
         从 web/public/ 拷进 dist，无需 deploy-web.yml 额外搬运。 -->
    <link rel="canonical" href="https://chestnuts-sisyphus.github.io/gittok/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitTok" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://chestnuts-sisyphus.github.io/gittok/" />
    <meta property="og:title" content="GitTok — 刷 GitHub 好项目" />
    <meta
      property="og:description"
      content="开源版抖音信息流：每天自动聚合 GitHub 与全球 AI 生态的好项目，LLM 写中文摘要与评分。无需登录，匿名只读接口对 agent 开放。"
    />
    <meta property="og:image" content="https://chestnuts-sisyphus.github.io/gittok/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GitTok 信息流界面：左侧频道与分区，右侧中文项目卡片" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitTok — 刷 GitHub 好项目" />
    <meta
      name="twitter:description"
      content="开源版抖音信息流：每天自动聚合 GitHub 与全球 AI 生态的好项目，LLM 写中文摘要与评分。无需登录。"
    />
    <meta name="twitter:image" content="https://chestnuts-sisyphus.github.io/gittok/og-image.png" />
    <meta name="twitter:image:alt" content="GitTok 信息流界面：左侧频道与分区，右侧中文项目卡片" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./data/feed.json" as="fetch" crossorigin />
    <!-- 字体本地化（二十轮 N2，2026-10-06 取证后定）：旧走 Google Fonts（preconnect×2 +
         异步 CSS），线上 trace 实测 fonts.googleapis.com 是第三方冷连接域（600–840ms/域，
         且国内不可达时 Lora 从未真正加载、永远系统 serif 兜底）。本地化后 Lora（拉丁/数字，
         latin 子集，OFL 授权见 fonts/LICENSE-OFL.txt）同源随站分发：零第三方域、零额外握手，
         font-display:swap 与旧行为一致（系统 serif 先渲染、字体到位后换装）。
         中文仍走系统 Noto Serif SC/宋体栈，样式表 --font-serif 未动。 -->
    <style>
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("./fonts/lora-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("./fonts/lora-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("./fonts/lora-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("./fonts/lora-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Lora";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("./fonts/lora-latin-400-italic.woff2") format("woff2");
      }
    </style>
    <title>GitTok — 刷 GitHub 好项目</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
