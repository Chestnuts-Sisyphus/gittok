<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="GitTok — 用中文刷 GitHub 好项目 · AI 推荐 · 大牛动态 · 搜索" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./data/feed.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 只拉 Lora（拉丁/数字）。Noto Serif SC 走系统字体：Google CSS 会展开 400+ @font-face，卡首屏。
         异步加载（preload+onload 切换）：国内访问 Google Fonts 慢/超时时不再阻塞首屏渲染，系统 serif 兜底 -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>GitTok — 刷 GitHub 好项目</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
