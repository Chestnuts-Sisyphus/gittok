name: Deploy Web

on:
  # push 到 master 且 web/ 或 data/ 有变动时部署
  push:
    branches: [master]
    paths:
      - "web/**"
      - "data/**"
  # daily-digest / feed-drip 跑完后自动部署（drip 的 GITHUB_TOKEN push 不触发 on:push，
  # 滴灌新卡要靠这条 workflow_run 才能上线——GT-0906-01 验收实证 40 轮更新全被 skipped）
  # 2026-09-14 补：新增的两个 feed workflow 也必须在此列——否则它们产出的卡/进度
  # 只在仓库里、永远上不了站（分档轮首跑即撞此坑：数据 push 成功但站点仍是旧数据）。
  workflow_run:
    workflows:
      - "Daily Agents Radar"
      - "Feed Drip（少量多次滴灌）"
      - "Feed Tier Drip（分档 24h 运转）"
      - "Feed Full Build（全量建库·点火就绪）"
    types:
      - completed
  # 手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: "deploy-web"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只在 daily-digest 成功时部署（workflow_run 触发时）
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Copy following snapshot
        run: |
          mkdir -p web/public/data
          if [ -f data/following.json ]; then
            cp data/following.json web/public/data/following.json
            echo "Copied data/following.json"
          fi
          # feed.json 由 vite prepare-feed 插件从 data/feed.json 剥离 detailCn 后写入 public/data

      # 接口域名统一（2026-09-17）：feed.xml / manifest.json 原先只在 raw.githubusercontent
      # 域名可达、站点 404——统一到站点域名，agent 与人类从同一入口拿全部接口（G5）。
      # vite 会把 public/ 原样拷进 dist/。
      - name: Copy feed interfaces (feed.xml / manifest.json)
        run: |
          cp feed.xml web/public/feed.xml
          cp manifest.json web/public/manifest.json
          ls -la web/public/feed.xml web/public/manifest.json

      # agent 可读文档镜像（2026-09-17）：API 文档 / Agent Skill / MCP 说明在仓库里是 .md，
      # 而 raw.githubusercontent 大陆不可达、jsDelivr 对 .md 会 301 跳回 raw——
      # 故按同一条「接口统一到站点」纪律，随构建镜像一份到站点域名（单一源仍是仓库文件）。
      - name: Copy agent docs (API.md / SKILL.md / MCP.md)
        run: |
          mkdir -p web/public/agent
          cp docs/API.md web/public/agent/API.md
          cp skills/gittok/SKILL.md web/public/agent/SKILL.md
          cp mcp-gittok/README.md web/public/agent/MCP.md
          ls -la web/public/agent/

      # 日报 markdown 站点镜像（2026-09-17）：digests/*.md 原先只在仓库里（raw 大陆不可达）。
      # 全量 85MB 不宜每次部署，故镜像**最近 7 天**；再复制一份为 digests/latest/，
      # 让 llms.txt 能给出一个不会随日期腐化的稳定链接。
      - name: Copy recent digests (last 7 days + latest)
        run: |
          mkdir -p web/public/digests
          days=$(ls -1 digests | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -7)
          for d in $days; do cp -r "digests/$d" "web/public/digests/$d"; done
          latest=$(echo "$days" | tail -1)
          if [ -n "$latest" ]; then cp -r "digests/$latest" web/public/digests/latest; fi
          echo "mirrored: $days (latest=$latest)"; ls -1 web/public/digests

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
