name: Deploy Web

on:
  # push 到 master 且 web/ 或 data/ 有变动时部署
  push:
    branches: [master]
    paths:
      - "web/**"
      - "data/**"
  # daily-digest / feed-drip 跑完后自动部署（drip 的 GITHUB_TOKEN push 不触发 on:push，
  # 滴灌新卡要靠这条 workflow_run 才能上线——GT-0906-01 验收实证 40 轮更新全被 skipped）
  workflow_run:
    workflows: ["Daily Agents Radar", "Feed Drip（少量多次滴灌）"]
    types:
      - completed
  # 手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: "deploy-web"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只在 daily-digest 成功时部署（workflow_run 触发时）
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Copy following snapshot
        run: |
          mkdir -p web/public/data
          if [ -f data/following.json ]; then
            cp data/following.json web/public/data/following.json
            echo "Copied data/following.json"
          fi
          # feed.json 由 vite prepare-feed 插件从 data/feed.json 剥离 detailCn 后写入 public/data

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
