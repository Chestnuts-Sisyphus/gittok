name: Monthly Agents Radar

concurrency:
  # D1 根治（2026-09-14）：本 workflow 会整份重写 data/feed.json。
  # 过去每个 workflow 只与自己串行（group 各自独立）→ 不同 workflow 可同时写同一份文件，
  # 实测丢过成果（本地回填被 bot 提交覆盖 / CI rebase abort 丢工作树 / 两个回填进程互覆盖）。
  # 现在**所有数据写入者共用同一个 group**：任一时刻只跑一个，其余排队（不取消，避免丢轮次）。
  group: feed-data-writer
  cancel-in-progress: false

on:
  schedule:
    # 1st of month 02:00 UTC = 10:00 CST
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run monthly rollup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: agnes
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL || 'agnes-2.0-flash' }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm monthly

      - name: Commit monthly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No monthly report to commit"
          else
            MONTH=$(date -u +%Y-%m)
            git commit -m "digest: ${MONTH} monthly digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm notify
