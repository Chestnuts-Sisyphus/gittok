name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 卡片级不变量闸（D2，2026-09-14）：管道产物与人为改动都必须在提交前过这道闸——
      # 「字段无声消失」那次事故（zone 覆盖率 100% → 0.2%）靠人肉发现太晚，改成机器拦。
      # 硬失败（必备字段缺失 / 相对 feed.prev.json 字段回退）→ 这一步红 → 拒绝合并。
      - name: Card invariants gate（D2）
        run: npx tsx scripts/gittok-card-invariants.ts

      # 频道容量闸（V-C，栗子 L8）：每个核心频道必须真的能滚到 ≥300 张、无重复、
      # 显示张数 = 实际张数、前缀配额合规。
      - name: Channel capacity check（V-C）
        run: npx tsx scripts/gittok-channel-capacity.ts

  # GitTok MCP server（2026-09-17）：search / top / detail 三 tool 的打包与测试。
  # 关键一步是 parity 测试——把打包产物与站点源码（web/src/search.ts、
  # src/feed/channel-policy.ts）直跑结果逐条比对，防止 MCP 侧长出第二套排序逻辑。
  mcp-gittok:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: mcp-gittok
        run: npm ci

      - name: Typecheck
        working-directory: mcp-gittok
        run: npm run typecheck

      - name: Build bundle
        working-directory: mcp-gittok
        run: npm run build

      - name: Test（parity + 边界）
        working-directory: mcp-gittok
        run: npm test
